version: '3.8'

services:
  claude-gcms:
    build:
      context: .
      dockerfile: Dockerfile.claude
    container_name: claude-gcms
    volumes:
      # Mount GCMS project (read-write)
      - .:/app
      # Mount Claude config from host
      - ~/.claude:/root/.claude:rw
      # Persist node_modules (optional - prevents reinstalling)
      - gcms_frontend_modules:/app/frontend/node_modules
      - gcms_backend_modules:/app/backend/node_modules
    working_dir: /app
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - TERM=xterm-256color
    command: tail -f /dev/null

volumes:
  gcms_frontend_modules:
  gcms_backend_modules: