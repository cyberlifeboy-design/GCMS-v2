version: '3.8'

# NOTE (2026-09-12): schema.prisma's datasource moved from postgresql to mysql to
# match the Azure Database for MySQL Flexible Server IT provisioned for the Azure
# dev environment. This is now the one supported engine for the whole app.
# IMPORTANT — do not just redeploy this file against the live gcms.mehaisi.com
# server: its existing "postgres_data" volume holds real production data in
# Postgres wire format. Switching the image here only gives that server a new,
# empty MySQL container — it does NOT migrate the existing rows. A real
# pg_dump-then-import (or equivalent ETL) into MySQL must happen first.
services:
  mysql:
    image: mysql:8.4
    container_name: gcms-mysql
    environment:
      MYSQL_DATABASE: gcms
      MYSQL_USER: gcms_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — no insecure default}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set — no insecure default}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gcms_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gcms_user", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gcms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER must be set — no insecure default}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set — no insecure default}
    volumes:
      - minio_data:/data
    networks:
      - gcms_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build: ./backend
    container_name: gcms-backend
    environment:
      - DATABASE_URL=mysql://gcms_user:${DB_PASSWORD}@mysql:3306/gcms
      - PORT=3005
      - NODE_ENV=production
      - CORS_ORIGIN=https://gcms.mehaisi.com
      - MINIO_ENDPOINT=minio
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - FRONTEND_URL=https://gcms.mehaisi.com
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@gcms.local}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gcms_network
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gcms-api.rule=Host(`api.gcms.mehaisi.com`) || (Host(`gcms.mehaisi.com`) && PathPrefix(`/api`))"
      - "traefik.http.routers.gcms-api.entrypoints=web,websecure"
      - "traefik.http.routers.gcms-api.priority=100"
      - "traefik.http.services.gcms-api.loadbalancer.server.port=3005"
    restart: unless-stopped

  # MailHog - Development only email testing (not for production)
  # Remove this service in production and set RESEND_API_KEY instead
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gcms-mailhog
    profiles:
      - dev
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gcms_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: gcms-frontend
    networks:
      - gcms_network
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gcms.rule=Host(`gcms.mehaisi.com`)"
      - "traefik.http.routers.gcms.entrypoints=web,websecure"
      - "traefik.http.services.gcms.loadbalancer.server.port=4173"
    restart: unless-stopped

networks:
  gcms_network:
    driver: bridge
  traefik_public:
    external: true

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
